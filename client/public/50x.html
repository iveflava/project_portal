      body {
        margin: 0;
        font-family: "Roboto",sans-serif;
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.5;
        color: #5b626b;
        text-align: var(--bs-body-text-align);
        background-color: #f8f9fa;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
          overflow: hidden;
      }

      *, input, button, select {
        font-family: 'Inter';
      }

      *, ::after, ::before {
        box-sizing: border-box;
      }

      a {
        text-decoration: none;
      }

      .error-wrapper {
        width: 100dvw;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .error-container {
        display: flex;
        flex-direction: column;
        row-gap: 32px;
      }

      .error-descr {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .error-code {
        font-size: 30px;
        line-height: 40px;
        font-weight: 600;
        text-align: center;
        color: #18182a;
        margin-bottom: 4px;
      }

      .error-text {
        font-size: 14px;
        line-height: 22px;
        text-align: center;
        color: #18182a;
      }

      .error-link-back {
        display: flex;
        align-items: center;
        column-gap: 4px;
        margin-top: 16px;
        padding: 6px 12px;
        background-color: #2a63ef;
        border-radius: 8px;
        font-size: 14px;
        line-height: 22px; 
        color: #fff;
        user-select: none;
        transition-property: background-color;
        transition-duration: .2s;
      }

      .error-link-back:hover{
        background-color: #4275f1;
      }

      .error-link-back:active{
        background-color: #3560d2;
      }
    </style>
</head>
